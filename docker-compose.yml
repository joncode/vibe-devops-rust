services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: vibe-devops-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: vibe_devops
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: vibe-devops-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    command: redis-server --appendonly yes

  # Vibe DevOps Server (for production-like deployment)
  # Uncomment when you want to run the server in Docker
  # app:
  #   build:
  #     context: .
  #     dockerfile: docker/Dockerfile
  #   container_name: vibe-devops-server
  #   environment:
  #     DATABASE_URL: postgres://postgres:postgres@postgres:5432/vibe_devops
  #     REDIS_URL: redis://redis:6379
  #     SERVER_HOST: 0.0.0.0
  #     SERVER_PORT: 8080
  #     ENVIRONMENT: development
  #     JWT_SECRET: development-secret-change-in-production-32chars
  #   ports:
  #     - "8080:8080"
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #     redis:
  #       condition: service_healthy

volumes:
  postgres_data:
  redis_data:

networks:
  default:
    name: vibe-devops-network
