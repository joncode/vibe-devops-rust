[package]
name = "vibe-devops-server"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
authors = ["Jon <programcodex@gmail.com>"]
description = "A production-ready DevOps backend server built in Rust"
license = "MIT"

[dependencies]
# Web Framework
axum = { version = "0.7", features = ["ws", "multipart", "macros"] }
axum-extra = { version = "0.9", features = ["typed-header", "cookie"] }
tower = { version = "0.5", features = ["full"] }
tower-http = { version = "0.5", features = [
    "cors", "compression-gzip", "trace", "request-id", "catch-panic", "timeout"
] }

# Async Runtime
tokio = { version = "1", features = ["full", "tracing"] }

# Database
sqlx = { version = "0.8", features = [
    "runtime-tokio", "tls-rustls", "postgres", 
    "uuid", "chrono", "json", "migrate"
] }

# Redis
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Authentication
jsonwebtoken = "9"
argon2 = "0.5"
rand = "0.8"
uuid = { version = "1", features = ["v4", "v7", "serde"] }

# Validation
validator = { version = "0.18", features = ["derive"] }

# Date/Time
chrono = { version = "0.4", features = ["serde"] }

# Configuration
config = "0.14"
dotenvy = "0.15"

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Error Handling
thiserror = "1.0"
anyhow = "1.0"

# Utilities
once_cell = "1"
async-trait = "0.1"
futures = "0.3"
base64 = "0.22"
hex = "0.4"
sha2 = "0.10"

[dev-dependencies]
tokio-test = "0.4"
reqwest = { version = "0.12", features = ["json", "cookies"] }

[[bin]]
name = "vibe-devops-server"
path = "src/main.rs"
